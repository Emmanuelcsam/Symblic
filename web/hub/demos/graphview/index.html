<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Symblic Graph View</title>
  <style>
    :root {
      --bg-color: #121217;
      --panel-bg: rgba(22, 22, 28, 0.88);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text-color: #dcddde;
      --text-muted: #8e9297;
      --accent-color: #5865f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #graph-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    #label-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 2;
      pointer-events: none;
    }

    #settings-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 320px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 64px);
      overflow-y: auto;
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    #settings-panel::-webkit-scrollbar {
      width: 6px;
    }

    #settings-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .graph-settings-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 14px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .control-row label {
      flex: 1;
      color: var(--text-color);
      user-select: none;
      cursor: pointer;
    }

    .control-value {
      font-family: monospace;
      font-size: 11px;
      color: var(--text-muted);
      min-width: 36px;
      text-align: right;
    }

    .graph-control-slider input[type="range"] {
      flex: 1;
      max-width: 120px;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .graph-control-toggle input[type="checkbox"] {
      cursor: pointer;
      accent-color: var(--accent-color);
      width: 16px;
      height: 16px;
    }

    .graph-control-search {
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
    }

    .graph-control-search input[type="text"] {
      width: 100%;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      color: var(--text-color);
      font-size: 13px;
      outline: none;
    }

    .graph-control-search input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    .graph-control-search .control-value {
      display: none;
    }

    footer, #graph-footer {
      position: absolute;
      bottom: 12px;
      left: 16px;
      z-index: 5;
      font-size: 12px;
      color: var(--text-muted);
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <canvas id="graph-canvas"></canvas>
  <canvas id="label-canvas"></canvas>
  <div id="settings-panel"></div>
  <footer id="graph-footer">Symblic beta</footer>

  <script src="vault-data.js"></script>
  <script src="graph-engine.js"></script>
  <script src="graph-render.js"></script>
  <script src="graph-input.js"></script>
  <script src="graph-ui.js"></script>
  <script>
    const graphCanvas = document.getElementById('graph-canvas');
    const labelCanvas = document.getElementById('label-canvas');
    const settingsPanel = document.getElementById('settings-panel');

    const engine = new GraphEngine();
    engine.initialize(VAULT_DATA);

    const renderer = new GraphRender(graphCanvas, labelCanvas, engine, VAULT_DATA);

    attachGraphInput(graphCanvas, renderer, engine);

    mountGraphUI(settingsPanel, renderer, engine, VAULT_DATA);

    function frame() {
      renderer.frame();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
