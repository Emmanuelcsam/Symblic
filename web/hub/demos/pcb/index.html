<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laptop PCB Explorer and Maker</title>
<style>
  :root {
    --bg-dark: #1a1a2e;
    --bg-darker: #16213e;
    --text: #eaeaea;
    --text-muted: #9a9a9a;
    --accent: #0f3460;
    --highlight: #e94560;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg-dark);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    padding: 0;
  }
  header {
    background: var(--bg-darker);
    padding: 12px 16px;
    border-bottom: 1px solid var(--accent);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.5px;
    color: var(--text);
  }
  header span {
    color: var(--highlight);
    font-weight: 400;
  }
  .tabs {
    display: flex;
    background: var(--bg-darker);
    border-bottom: 1px solid var(--accent);
  }
  .tab {
    flex: 1;
    padding: 12px 0;
    text-align: center;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    transition: color 0.2s;
  }
  .tab.active {
    color: var(--highlight);
    border-bottom: 2px solid var(--highlight);
  }
  .tab:hover {
    color: var(--text);
  }
  .tab-content {
    display: none;
    height: calc(100vh - 120px);
    overflow: hidden;
  }
  .tab-content.active {
    display: flex;
  }
  #explore-content {
    display: flex;
    height: 100%;
  }
  #pcb-canvas {
    flex: 1;
    height: 100%;
    background: #0a0a0a;
    outline: none;
  }
  #pcb-labels {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    background: transparent;
  }
  #pcb-info {
    width: 280px;
    min-width: 240px;
    background: var(--bg-darker);
    border-left: 1px solid var(--accent);
    padding: 12px;
    overflow-y: auto;
    color: var(--text);
    font-size: 12px;
  }
  #pcb-maker {
    flex: 1;
    height: 100%;
    padding: 16px;
    background: var(--bg-darker);
    overflow-y: auto;
  }
</style>
</head>
<body>
  <header><h1>Laptop PCB Explorer and Maker <span>— Symblic beta</span></h1></header>
  <div class="tabs">
    <button class="tab active" data-tab="explore">Explore board</button>
    <button class="tab" data-tab="maker">Make a board</button>
  </div>
  <div id="explore-content" class="tab-content active">
    <canvas id="pcb-canvas"></canvas>
    <canvas id="pcb-labels"></canvas>
    <aside id="pcb-info"></aside>
  </div>
  <div id="maker-content" class="tab-content">
    <div id="pcb-maker"></div>
  </div>

  <script src="pcb-data.js"></script>
  <script src="pcb-parts.js"></script>
  <script src="pcb-render.js"></script>
  <script src="pcb-input.js"></script>
  <script src="pcb-info.js"></script>
  <script src="pcb-maker.js"></script>
  <script>
    (function () {
      var exploreTab = document.querySelector('.tab[data-tab="explore"]');
      var makerTab = document.querySelector('.tab[data-tab="maker"]');
      var exploreContent = document.getElementById('explore-content');
      var makerContent = document.getElementById('maker-content');

      function showTab(tabName) {
        var isExplore = tabName === 'explore';
        exploreContent.classList.toggle('active', isExplore);
        makerContent.classList.toggle('active', !isExplore);
        exploreTab.classList.toggle('active', isExplore);
        makerTab.classList.toggle('active', !isExplore);
      }

      exploreTab.addEventListener('click', function () { showTab('explore'); });
      makerTab.addEventListener('click', function () { showTab('maker'); });

      var canvas = document.getElementById('pcb-canvas');
      var labels = document.getElementById('pcb-labels');
      var info = document.getElementById('pcb-info');
      var maker = document.getElementById('pcb-maker');

      var renderer = null;
      var activeTab = 'explore';
      var animId = null;

      function renderLoop() {
        if (activeTab === 'explore' && renderer) {
          renderer.frame();
        }
        animId = requestAnimationFrame(renderLoop);
      }

      function startRenderLoop() {
        if (animId === null) {
          renderLoop();
        }
      }

      function stopRenderLoop() {
        if (animId !== null) {
          cancelAnimationFrame(animId);
          animId = null;
        }
      }

      function onTabChange(tabName) {
        activeTab = tabName;
        if (tabName === 'explore') {
          if (renderer) {
            startRenderLoop();
          }
        } else {
          stopRenderLoop();
        }
      }

      function mountInfoPanel(selection) {
        if (typeof mountPCBInfo === 'function') {
          mountPCBInfo(info, BOARD_CORE, BOARD_PARTS, renderer, selection);
        }
      }

      document.addEventListener('DOMContentLoaded', function () {
        renderer = new PCBRender(canvas, labels, BOARD_CORE, BOARD_PARTS);
        attachPCBInput(canvas, renderer, mountInfoPanel);
        mountPCBInfo(info, BOARD_CORE, BOARD_PARTS, renderer);
        mountPCBMaker(maker);

        activeTab = 'explore';
        startRenderLoop();
      });

      // Wire tab buttons to onTabChange
      exploreTab.onclick = function () { showTab('explore'); onTabChange('explore'); };
      makerTab.onclick = function () { showTab('maker'); onTabChange('maker'); };
    })();
  </script>
</body>
</html>
