  .sb-hero{padding:26px var(--pad) 8px;max-width:var(--maxw);margin:0 auto}

  .sb-wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad) 60px}

  .sb-sec>.sub{color:var(--tx3);font-size:13.5px;margin-bottom:14px;line-height:1.5}
  .sb-card{border:1px solid var(--brd);border-radius:8px;padding:16px;margin-bottom:14px;background:var(--bg1)}

  .sb-tag{font-family:var(--mono);font-size:11.5px;border:1px solid var(--brd);border-radius:99px;padding:2px 9px;color:var(--tx2);display:inline-block;margin-left:6px;vertical-align:middle}

  .sb-tag.err{color:var(--err);border-color:var(--err)}

  .sb-kv b{color:var(--tx2);font-weight:400}

  table.sb-t td.id{font-family:var(--mono);color:var(--acc-tx);white-space:nowrap}
  .sb-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  button.sb-b{font-family:var(--mono);font-size:14px;min-height:38px;padding:6px 14px;border-radius:6px;border:1px solid var(--ctl);background:var(--bg2);color:var(--tx1);cursor:pointer}
  button.sb-b:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  button.sb-b[aria-pressed="true"]{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
  canvas.sb-c{width:100%;max-width:420px;height:auto;border:1px solid var(--brd);border-radius:6px;display:block;background:var(--bg2)}
  canvas.sb-rain{max-width:520px;background:#000}
  .sb-frame-note{font-family:var(--mono);font-size:12px;color:var(--tx3);margin-top:6px}
  details.sb-d{border:1px solid var(--hair);border-radius:6px;margin-top:10px;background:var(--bg2)}
  details.sb-d summary{cursor:pointer;padding:9px 12px;font-family:var(--mono);font-size:12.5px;color:var(--tx2)}
  details.sb-d>div{padding:0 12px 12px}
  .sb-out{font-family:var(--mono);font-size:14px;color:var(--tx1);padding:2px 0}
  a.sb-a{color:var(--acc-tx)}
  .sb-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:640px){.sb-cols{grid-template-columns:1fr}}
  .sb-fail{border-left:3px solid var(--err)}
  .sb-head{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px var(--pad);background:var(--bg1);border-bottom:1px solid var(--brd);flex-wrap:wrap}
  .sb-head .sb-brand{font-family:var(--mono);font-size:15px;color:var(--tx1);text-decoration:none;font-weight:700}
  .sb-head nav{display:flex;gap:16px;flex-wrap:wrap}
  .sb-head nav a{font-family:var(--mono);font-size:13.5px;color:var(--acc-tx);text-decoration:none}

p.\n\nDisplay the accepted animation and repeat it in the character player.\n","sources":{"bouncing_ball":"# Bouncing ball: a checked animation on a terminal grid.\nRemember width is 20.\nRemember height is 7.\nRemember 'x 0' is 2.\nRemember 'y 0' is 2.\nDisplay 9 at column 'x 0' and row 'y 0' on a grid width columns by height rows.\n\nAsk for 'x 1' as a whole number from 0 to 19: \"The ball is at column x_0. Move it one step right. If that would leave the range 0 to 19, move one step left instead. Return only the new column.\".\nUsing only 'x 0'.\nAccept only if 'x 1' is at least 0.\nAccept only if 'x 1' is at most width minus 1.\nAsk for 'y 1' as a whole number from 0 to 6: \"The ball is at row y_0. Move it one step down. If that would leave the range 0 to 6, move one step up instead. Return only the new row.\".\nUsing only 'y 0'.\nAccept only if 'y 1' is at least 0.\nAccept only if 'y 1' is at most height minus 1.\nDisplay 9 at column 'x 1' and row 'y 1' on a grid width columns by height rows.\n\nAsk for 'x 2' as a whole number from 0 to 19: \"The ball is at column x_1. Move it one step right. If that would leave the range 0 to 19, move one step left instead. Return only the new column.\".\nUsing only 'x 1'.\nAccept only if 'x 2' is at least 0.\nAccept only if 'x 2' is at most width minus 1.\nAsk for 'y 2' as a whole number from 0 to 6: \"The ball is at row y_1. Move it one step down. If that would leave the range 0 to 6, move one step up instead. Return only the new row.\".\nUsing only 'y 1'.\nAccept only if 'y 2' is at least 0.\nAccept only if 'y 2' is at most height minus 1.\nDisplay 9 at column 'x 2' and row 'y 2' on a grid width columns by height rows.\n\nAsk for 'x 3' as a whole number from 0 to 19: \"The ball is at column x_2. Move it one step right. If that would leave the range 0 to 19, move one step left instead. Return only the new column.\".\nUsing only 'x 2'.\nAccept only if 'x 3' is at least 0.\nAccept only if 'x 3' is at most width minus 1.\nAsk for 'y 3' as a whole number from 0 to 6: \"The ball is at row y_2. Move it one step down. If that would leave the range 0 to 6, move one step up instead. Return only the new row.\".\nUsing only 'y 2'.\nAccept only if 'y 3' is at least 0.\nAccept only if 'y 3' is at most height minus 1.\nDisplay 9 at column 'x 3' and row 'y 3' on a grid width columns by height rows.\n","bar_chart":"# Growing bar chart: a checked bar rises one row per frame. Row 0 is the bottom.\nRemember width is 20.\nRemember height is 10.\nRemember 'bar column' is 4.\nRemember 'bar height 0' is 1.\nDisplay 1 at column 'bar column' and row 'bar height 0' on a grid width columns by height rows.\n\nAsk for 'bar height 1' as a whole number from 1 to 10: \"Add 1 to the number given as bar_height_0. Return only the sum.\".\nUsing only 'bar height 0'.\nAccept only if 'bar height 1' equals 'bar height 0' plus 1.\nDisplay 2 at column 'bar column' and row 'bar height 1' on a grid width columns by height rows.\n\nAsk for 'bar height 2' as a whole number from 1 to 10: \"Add 1 to the number given as bar_height_1. Return only the sum.\".\nUsing only 'bar height 1'.\nAccept only if 'bar height 2' equals 'bar height 1' plus 1.\nDisplay 3 at column 'bar column' and row 'bar height 2' on a grid width columns by height rows.\n\nAsk for 'bar height 3' as a whole number from 1 to 10: \"Add 1 to the number given as bar_height_2. Return only the sum.\".\nUsing only 'bar height 2'.\nAccept only if 'bar height 3' equals 'bar height 2' plus 1.\nDisplay 4 at column 'bar column' and row 'bar height 3' on a grid width columns by height rows.\n\nAsk for 'bar height 4' as a whole number from 1 to 10: \"Add 1 to the number given as bar_height_3. Return only the sum.\".\nUsing only 'bar height 3'.\nAccept only if 'bar height 4' equals 'bar height 3' plus 1.\nDisplay 5 at column 'bar column' and row 'bar height 4' on a grid width columns by height rows.\n","knight_jump":"# Knight jump: a fully checked chess knight move drawn on a board grid.\nRemember width is 8.\nRemember height is 8.\nRemember 'start column' is 2.\nRemember 'start row' is 2.\nDisplay 1 at column 'start column' and row 'start row' on a grid width columns by height rows.\n\nAsk for 'landing column' as a whole number from 0 to 7: \"A chess knight stands at column start_column. It moves two columns to the right. Return only its new column.\".\nUsing only 'start column'.\nAccept only if 'landing column' equals 'start column' plus 2.\nAsk for 'landing row' as a whole number from 0 to 7: \"A chess knight stands at row start_row. After moving two columns it also moves one row up. Return only its new row.\".\nUsing only 'start row'.\nAccept only if 'landing row' equals 'start row' plus 1.\nDisplay 2 at column 'landing column' and row 'landing row' on a grid width columns by height rows.\n","staircase":"# Staircase climb: a fully checked diagonal climb, one frame per step. Row 0 is the bottom.\nRemember width is 20.\nRemember height is 10.\nRemember 'x 1' is 1.\nRemember 'y 1' is 1.\nDisplay 1 at column 'x 1' and row 'y 1' on a grid width columns by height rows.\n\nAsk for 'x 2' as a whole number from 0 to 19: \"Add 1 to the number given as x_1. Return only the sum.\".\nUsing only 'x 1'.\nAccept only if 'x 2' equals 'x 1' plus 1.\nAsk for 'y 2' as a whole number from 0 to 9: \"Add 1 to the number given as y_1. Return only the sum.\".\nUsing only 'y 1'.\nAccept only if 'y 2' equals 'y 1' plus 1.\nDisplay 2 at column 'x 2' and row 'y 2' on a grid width columns by height rows.\n\nAsk for 'x 3' as a whole number from 0 to 19: \"Add 1 to the number given as x_2. Return only the sum.\".\nUsing only 'x 2'.\nAccept only if 'x 3' equals 'x 2' plus 1.\nAsk for 'y 3' as a whole number from 0 to 9: \"Add 1 to the number given as y_2. Return only the sum.\".\nUsing only 'y 2'.\nAccept only if 'y 3' equals 'y 2' plus 1.\nDisplay 3 at column 'x 3' and row 'y 3' on a grid width columns by height rows.\n\nAsk for 'x 4' as a whole number from 0 to 19: \
