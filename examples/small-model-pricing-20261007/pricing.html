<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Plans</title>
  <style>* { box-sizing: border-box; } body { margin: 0; background: #111; color: #f5f5f5; font-family: sans-serif; font-size: 16px; } main { padding: 16px; } .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 16px; } .card { background: #222; padding: 24px; } button { min-height: 44px; font-size: 16px; color: #111; background: #eee; } button:focus-visible { outline: 3px solid #7dd3fc; outline-offset: 3px; }</style>
</head>
<body>
  <main>
    <h1>Pricing Plans</h1>
    <div class="grid">
      <section class="card"><h2>Basic</h2><p>$0</p><button type="button">Select</button></section>
      <section class="card"><h2>Studio</h2><p>$12</p><button type="button">Select</button></section>
      <section class="card"><h2>Team</h2><p>$30</p><button type="button">Select</button></section>
    </div>
  </main>
</body>
</html>
