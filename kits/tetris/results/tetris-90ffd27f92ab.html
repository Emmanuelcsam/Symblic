<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tetris</title>
<style>
html, body { margin: 0; background: #111; color: #eee; font-family: sans-serif; }
#wrap { display: flex; gap: 16px; justify-content: center; padding: 16px; }
canvas { display: block; background: #000; }
</style>
</head>
<body>
<div id="wrap"><canvas id="board" width="300" height="600"></canvas><canvas id="side" width="180" height="600"></canvas></div>
<script>
const SHAPES = {
  I: { n: 4, cells: [[1, 0], [1, 1], [1, 2], [1, 3]] },
  O: { n: 2, cells: [[0, 0], [0, 1], [1, 0], [1, 1]] },
  T: { n: 3, cells: [[0, 1], [1, 0], [1, 1], [1, 2]] },
  S: { n: 3, cells: [[0, 1], [0, 2], [1, 0], [1, 1]] },
  Z: { n: 3, cells: [[0, 0], [0, 1], [1, 1], [1, 2]] },
  J: { n: 3, cells: [[0, 0], [1, 0], [1, 1], [1, 2]] },
  L: { n: 3, cells: [[0, 2], [1, 0], [1, 1], [1, 2]] }
};

const COLORS = {
  I: "cyan",
  O: "yellow",
  T: "purple",
  S: "green",
  Z: "red",
  J: "blue",
  L: "orange"
};

const KICKS_JLSTZ = {
  "0>1": [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
  "1>0": [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
  "1>2": [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
  "2>1": [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
  "2>3": [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
  "3>2": [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
  "3>0": [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
  "0>3": [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]]
};

const KICKS_I = {
  "0>1": [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
  "1>0": [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
  "1>2": [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
  "2>1": [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
  "2>3": [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
  "3>2": [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
  "3>0": [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
  "0>3": [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]]
};

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function cellsOf(type, rot) {
  const n = SHAPES[type].n;
  const cells = SHAPES[type].cells;

  if (rot === 0) {
    return cells;
  }

  if (type === 'O') {
    return cells; // O never turns
  }

  const result = [];
  for (let i = 0; i < cells.length; i++) {
    const [r, c] = cells[i];
    result.push([c, n - 1 - r]);
  }

  let current = result;
  for (let i = 1; i < rot; i++) {
    const next = [];
    for (let j = 0; j < current.length; j++) {
      const [r, c] = current[j];
      next.push([c, n - 1 - r]);
    }
    current = next;
  }

  return current;
}

function emptyBoard() {
    const board = [];
    for (let i = 0; i < 22; i++) {
        board[i] = Array(10).fill('');
    }
    return board;
}

function fits(board, type, rot, row, col) {
  const n = SHAPES[type].n;
  const cells = cellsOf(type, rot);
  for (const [r, c] of cells) {
    const boardRow = row + r;
    const boardCol = col + c;
    if (boardRow < 0 || boardRow >= 22 || boardCol < 0 || boardCol >= 10) {
      return false;
    }
    if (board[boardRow][boardCol] !== '') {
      return false;
    }
  }
  return true;
}

function levelOf(lines) {
    return 1 + Math.floor(lines / 10);
}

function gravityMs(level) {
    return Math.max(1, Math.round(Math.pow(0.8 - (level - 1) * 0.007, level - 1) * 1000));
}

function refill(g) {
    const pieces = ['I','O','T','S','Z','J','L'];
    while (g.queue.length < 3) {
        let arr = pieces.slice();
        for (let i = 6; i >= 1; i--) {
            const j = Math.floor(g.rng() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        for (let i = 0; i < 7; i++) {
            g.queue.push(arr[i]);
        }
    }
}

function spawn(g, type) {
  const col = type === 'O' ? 4 : 3;
  g.active = { type, rot: 0, row: 0, col };
  g.fall = 0;
  g.lock = 0;
  g.resets = 0;
  if (!fits(g.board, type, 0, 0, col)) {
    g.over = true;
    g.active = null;
  }
}

function newGame(seed) {
    const g = { 
        board: emptyBoard(), 
        queue: [], 
        rng: mulberry32(seed), 
        active: null, 
        hold: null, 
        holdUsed: false, 
        score: 0, 
        lines: 0, 
        over: false, 
        paused: false, 
        fall: 0, 
        lock: 0, 
        resets: 0 
    };
    refill(g);
    spawn(g, g.queue.shift());
    refill(g);
    return g;
}

function resting(g) {
  if (!g.active) return true;
  const a = g.active;
  return !fits(g.board, a.type, a.rot, a.row + 1, a.col);
}

function afterMove(g, wasResting) {
  if (!resting(g)) {
    g.lock = 0;
    return;
  }
  if (wasResting && g.resets < 15) {
    g.lock = 0;
    g.resets += 1;
  }
}

function moveSide(g, dc) {
  const a = g.active;
  const was = resting(g);
  if (fits(g.board, a.type, a.rot, a.row, a.col + dc)) {
    a.col = a.col + dc;
    afterMove(g, was);
    return true;
  }
  return false;
}

function softDrop(g) {
  const a = g.active;
  const was = resting(g);
  if (fits(g.board, a.type, a.rot, a.row + 1, a.col)) {
    a.row = a.row + 1;
    g.score += 1;
    afterMove(g, was);
    return true;
  }
  return false;
}

function rotate(g, dir) {
  const a = g.active;
  if (!a || a.type === 'O') return false;
  const was = resting(g);
  const to = dir > 0 ? (a.rot + 1) % 4 : (a.rot + 3) % 4;
  const kicks = a.type === 'I' ? KICKS_I : KICKS_JLSTZ;
  const kickList = kicks[a.rot + '>' + to];
  for (const [dx, dy] of kickList) {
    if (fits(g.board, a.type, to, a.row - dy, a.col + dx)) {
      a.rot = to;
      a.row = a.row - dy;
      a.col = a.col + dx;
      afterMove(g, was);
      return true;
    }
  }
  return false;
}

function lockPiece(g) {
  const a = g.active;
  if (!a) return;
  
  const cells = cellsOf(a.type, a.rot);
  for (let [r, c] of cells) {
    g.board[a.row + r][a.col + c] = a.type;
  }
  
  const level = levelOf(g.lines);
  const kept = g.board.filter((row) => row.includes(''));
  const n = 22 - kept.length;
  
  g.board = Array.from({ length: n }, () => Array(10).fill('')).concat(kept);
  
  g.score += [0, 100, 300, 500, 800][n] * level;
  g.lines += n;
  
  g.holdUsed = false;
  
  spawn(g, g.queue.shift());
  refill(g);
}

function hardDrop(g) {
  const a = g.active;
  if (!a) return;
  
  let d = 0;
  while (fits(g.board, a.type, a.rot, a.row + 1, a.col)) {
    a.row++;
    d++;
  }
  
  g.score += 2 * d;
  lockPiece(g);
}

function holdPiece(g) {
  if (g.holdUsed) return false;
  g.holdUsed = true;
  const cur = g.active.type;
  if (g.hold === null) {
    g.hold = cur;
    spawn(g, g.queue.shift());
    refill(g);
  } else {
    const old = g.hold;
    g.hold = cur;
    spawn(g, old);
  }
  return true;
}

function step(g) {
  if (g.paused || g.over || !g.active) return;
  if (resting(g)) {
    g.lock += 1;
    if (g.lock >= 500) {
      lockPiece(g);
    }
    return;
  }
  g.lock = 0;
  g.fall += 1;
  if (g.fall >= gravityMs(levelOf(g.lines))) {
    g.fall = 0;
    g.active.row += 1;
  }
}

function tick(g, ms) {
  for (let i = 0; i < ms; i++) {
    step(g);
  }
}

function input(g, action) {
  if (action === 'pause') {
    if (!g.over) {
      g.paused = !g.paused;
    }
    return;
  }
  if (g.paused || g.over || !g.active) {
    return;
  }
  switch (action) {
    case 'left': moveSide(g, -1); break;
    case 'right': moveSide(g, 1); break;
    case 'down': softDrop(g); break;
    case 'drop': hardDrop(g); break;
    case 'cw': rotate(g, 1); break;
    case 'ccw': rotate(g, -1); break;
    case 'hold': holdPiece(g); break;
    default: break;
  }
}

function snapshot(g) {
  return {
    board: g.board.map((row) => row.slice()),
    active: g.active === null ? null : {
      type: g.active.type,
      rotation: g.active.rot,
      row: g.active.row,
      col: g.active.col,
      cells: g.active.type !== undefined ? cellsOf(g.active.type, g.active.rot).map(([r, c]) => [g.active.row + r, g.active.col + c]) : []
    },
    hold: g.hold,
    next: g.queue.slice(0, 3),
    score: g.score,
    lines: g.lines,
    over: g.over,
    paused: g.paused,
    level: levelOf(g.lines)
  };
}

function keyAction(e) {
  if (e.ctrlKey || e.altKey || e.metaKey) {
    return null;
  }
  switch (e.key) {
    case 'ArrowLeft': return 'left';
    case 'ArrowRight': return 'right';
    case 'ArrowDown': return 'down';
    case ' ': return 'drop';
    case 'ArrowUp': return 'cw';
    case 'x': case 'X': return 'cw';
    case 'z': case 'Z': return 'ccw';
    case 'c': case 'C': return 'hold';
    case 'p': case 'P': return 'pause';
    case 'r': case 'R': return 'restart';
    case 'Shift': return 'hold';
    default: return null;
  }
}

function drawCell(ctx, r, c, color) {
  ctx.fillStyle = color;
  ctx.fillRect(c * 30 + 1, (r - 2) * 30 + 1, 28, 28);
}

function drawBoard(g, board) {
  board.fillStyle = '#111';
  board.fillRect(0, 0, 300, 600);

  board.strokeStyle = '#333';
  board.lineWidth = 1;

  for (let c = 0; c <= 10; c++) {
    board.beginPath();
    board.moveTo(c * 30, 0);
    board.lineTo(c * 30, 600);
    board.stroke();
  }

  for (let r = 0; r <= 20; r++) {
    board.beginPath();
    board.moveTo(0, r * 30);
    board.lineTo(300, r * 30);
    board.stroke();
  }

  for (let r = 2; r <= 21; r++) {
    for (let c = 0; c <= 9; c++) {
      if (g.board[r][c] !== '') {
        drawCell(board, r, c, COLORS[g.board[r][c]]);
      }
    }
  }

  if (g.active !== null) {
    const a = g.active;
    let gr = a.row;
    while (fits(g.board, a.type, a.rot, gr + 1, a.col)) {
      gr++;
    }
    board.strokeStyle = COLORS[a.type];
    board.lineWidth = 2;
    const cells = cellsOf(a.type, a.rot);
    for (const [r, c] of cells) {
      if (gr + r >= 2) {
        board.strokeRect((a.col + c) * 30 + 2, (gr + r - 2) * 30 + 2, 26, 26);
      }
    }

    const cells2 = cellsOf(a.type, a.rot);
    for (const [r, c] of cells2) {
      if (a.row + r >= 2) {
        drawCell(board, a.row + r, a.col + c, COLORS[a.type]);
      }
    }
  }

  if (g.over) {
    board.fillStyle = '#fff';
    board.font = 'bold 36px sans-serif';
    board.textAlign = 'center';
    board.fillText('GAME OVER', 150, 300);
    board.textAlign = 'left';
  }
}

function drawSide(g, side) {
  // Step 1: Set background
  side.fillStyle = '#222';
  side.fillRect(0, 0, 180, 600);

  // Step 2: Score, Lines, Level
  side.fillStyle = '#eee';
  side.font = '18px sans-serif';
  side.textAlign = 'left';
  side.fillText('Score ' + g.score, 10, 30);
  side.fillText('Lines ' + g.lines, 10, 60);
  side.fillText('Level ' + levelOf(g.lines), 10, 90);

  // Step 3: Next piece
  side.fillText('Next', 10, 130);
  const queue = g.queue;
  for (let i = 0; i < 3 && i < queue.length; i++) {
    const t = queue[i];
    side.fillStyle = COLORS[t];
    const cells = cellsOf(t, 0);
    for (const [r, c] of cells) {
      side.fillRect(20 + c * 15, 145 + i * 70 + r * 15, 14, 14);
    }
  }

  // Step 4: Hold piece
  side.fillStyle = '#eee';
  side.fillText('Hold', 10, 380);
  if (g.hold !== null) {
    side.fillStyle = COLORS[g.hold];
    const holdCells = cellsOf(g.hold, 0);
    for (const [r, c] of holdCells) {
      side.fillRect(20 + c * 15, 395 + r * 15, 14, 14);
    }
  }
}

function draw(g, board, side) {
  drawBoard(g, board);
  drawSide(g, side);
}

function startGame() {
  const bctx = document.getElementById('board').getContext('2d');
  const sctx = document.getElementById('side').getContext('2d');
  let game = newGame(Date.now());
  let testMode = false;
  const paint = () => draw(game, bctx, sctx);
  
  window.tetris = {
    reset: (seed) => { game = newGame(seed); testMode = true; paint(); },
    input: (action) => { input(game, action); paint(); },
    tick: (ms) => { tick(game, ms); paint(); },
    state: () => { return snapshot(game); }
  };
  
  document.addEventListener('keydown', (e) => {
    const act = keyAction(e);
    if (act === null) return;
    e.preventDefault();
    if (act === 'restart') {
      game = newGame(Date.now());
    } else {
      input(game, act);
    }
    paint();
  });
  
  let last = null;
  const frame = (t) => {
    if (last === null) last = t;
    const ms = Math.min(100, Math.max(0, Math.round(t - last)));
    last = t;
    if (!testMode && ms > 0) {
      tick(game, ms);
    }
    paint();
    requestAnimationFrame(frame);
  };
  
  paint();
  requestAnimationFrame(frame);
}
startGame();
</script>
</body>
</html>
