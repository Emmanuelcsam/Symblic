<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tetris (golden)</title>
<style>body{margin:0;background:#111;color:#eee;font:16px monospace;display:flex;gap:16px;padding:16px}
#side{display:flex;flex-direction:column;gap:8px}canvas{background:#000}</style></head>
<body><canvas id="board" width="300" height="600"></canvas>
<div id="side"><div>Score <span id="score">0</span></div><div>Lines <span id="lines">0</span></div>
<div>Level <span id="level">1</span></div><div>Next</div><canvas id="next" width="120" height="270"></canvas>
<div>Hold</div><canvas id="hold" width="120" height="90"></canvas></div>
<script>
// The strict Tetris spec of request.txt, executable: the oracle the harness compares tetris.html against.
// Pure logic, no DOM. Time is advanced only by tick(ms), in 1 ms steps (gravity, then lock timer).

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const SHAPES = {
  I: { n: 4, cells: [[1, 0], [1, 1], [1, 2], [1, 3]] },
  O: { n: 2, cells: [[0, 0], [0, 1], [1, 0], [1, 1]] },
  T: { n: 3, cells: [[0, 1], [1, 0], [1, 1], [1, 2]] },
  S: { n: 3, cells: [[0, 1], [0, 2], [1, 0], [1, 1]] },
  Z: { n: 3, cells: [[0, 0], [0, 1], [1, 1], [1, 2]] },
  J: { n: 3, cells: [[0, 0], [1, 0], [1, 1], [1, 2]] },
  L: { n: 3, cells: [[0, 2], [1, 0], [1, 1], [1, 2]] },
};

// (dx, dy) with dy = +up; the box moves by row -dy, col +dx. States 0, 1 (R), 2, 3 (L).
const K_JLSTZ = {
  '0>1': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]], '1>0': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
  '1>2': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]], '2>1': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
  '2>3': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]], '3>2': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
  '3>0': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]], '0>3': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
};
const K_I = {
  '0>1': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]], '1>0': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
  '1>2': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]], '2>1': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
  '2>3': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]], '3>2': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
  '3>0': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]], '0>3': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
};

function boxCells(type, rot) {
  const { n, cells } = SHAPES[type];
  let out = cells.map(([r, c]) => [r, c]);
  if (type === 'O') return out;
  for (let k = 0; k < rot; k++) out = out.map(([r, c]) => [c, n - 1 - r]);
  return out;
}

const interval = (level) => Math.max(1, Math.round(Math.pow(0.8 - (level - 1) * 0.007, level - 1) * 1000));

class Game {
  constructor(seed = 1) { this.reset(seed); }

  reset(seed) {
    this.rng = mulberry32(seed);
    this.board = Array.from({ length: 22 }, () => Array(10).fill(''));
    this.queue = [];
    this.holdType = null; this.holdUsed = false;
    this.score = 0; this.lines = 0; this.over = false; this.paused = false;
    this.grav = 0; this.lockT = 0; this.resets = 0;
    this.active = null;
    this.refill();
    this.spawn(this.queue.shift());
    this.refill();
  }

  get level() { return 1 + Math.floor(this.lines / 10); }

  refill() {
    while (this.queue.length < 3) {
      const bag = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];
      for (let i = 6; i >= 1; i--) {
        const j = Math.floor(this.rng() * (i + 1));
        [bag[i], bag[j]] = [bag[j], bag[i]];
      }
      this.queue.push(...bag);
    }
  }

  fits(type, rot, row, col) {
    for (const [r, c] of boxCells(type, rot)) {
      const R = row + r, C = col + c;
      if (R < 0 || R > 21 || C < 0 || C > 9 || this.board[R][C]) return false;
    }
    return true;
  }

  spawn(type) {
    this.active = { type, rot: 0, row: 0, col: type === 'O' ? 4 : 3 };
    this.grav = 0; this.lockT = 0; this.resets = 0;
    if (!this.fits(type, 0, 0, this.active.col)) { this.over = true; this.active = null; }
  }

  resting() { const a = this.active; return !this.fits(a.type, a.rot, a.row + 1, a.col); }

  moved(wasResting) {            // after a successful move or rotation; wasResting: it could not move down BEFORE it
    if (!this.resting()) { this.lockT = 0; return; }       // free to fall again: no lock timer runs
    if (wasResting && this.resets < 15) { this.lockT = 0; this.resets += 1; }
  }

  input(action) {
    if (action === 'pause') { if (!this.over) this.paused = !this.paused; return; }
    if (this.paused || this.over || !this.active) return;
    const a = this.active;
    const was = this.resting();
    if (action === 'left' || action === 'right') {
      const dc = action === 'left' ? -1 : 1;
      if (this.fits(a.type, a.rot, a.row, a.col + dc)) { a.col += dc; this.moved(was); }
    } else if (action === 'down') {
      if (this.fits(a.type, a.rot, a.row + 1, a.col)) { a.row += 1; this.score += 1; this.moved(was); }
    } else if (action === 'drop') {
      let d = 0;
      while (this.fits(a.type, a.rot, a.row + 1, a.col)) { a.row += 1; d += 1; }
      this.score += 2 * d;
      this.lock();
    } else if (action === 'cw' || action === 'ccw') {
      if (a.type === 'O') return;
      const to = (a.rot + (action === 'cw' ? 1 : 3)) % 4;
      const table = a.type === 'I' ? K_I : K_JLSTZ;
      for (const [dx, dy] of table[`${a.rot}>${to}`]) {
        if (this.fits(a.type, to, a.row - dy, a.col + dx)) {
          a.rot = to; a.row -= dy; a.col += dx; this.moved(was); return;
        }
      }
    } else if (action === 'hold') {
      if (this.holdUsed) return;
      this.holdUsed = true;
      const cur = a.type;
      if (this.holdType === null) { this.holdType = cur; this.spawn(this.queue.shift()); this.refill(); }
      else { const t = this.holdType; this.holdType = cur; this.spawn(t); }
    }
  }

  lock() {
    const a = this.active;
    for (const [r, c] of boxCells(a.type, a.rot)) {
      const R = a.row + r, C = a.col + c;
      if (R >= 0 && R <= 21) this.board[R][C] = a.type;
    }
    const level = this.level;
    const kept = this.board.filter((row) => row.some((x) => !x));
    const n = 22 - kept.length;
    while (kept.length < 22) kept.unshift(Array(10).fill(''));
    this.board = kept;
    this.score += [0, 100, 300, 500, 800][n] * level;
    this.lines += n;
    this.holdUsed = false;
    this.spawn(this.queue.shift());
    this.refill();
  }

  tick(ms) {
    for (let i = 0; i < ms; i++) {
      if (this.paused || this.over || !this.active) return;
      const a = this.active;
      if (this.resting()) {
        this.lockT += 1;
        if (this.lockT >= 500) this.lock();
      } else {
        this.lockT = 0;
        this.grav += 1;
        if (this.grav >= interval(this.level)) { this.grav = 0; a.row += 1; }
      }
    }
  }

  state() {
    const a = this.active;
    return {
      board: this.board.map((r) => r.slice()),
      active: a ? { type: a.type, rotation: a.rot, row: a.row, col: a.col,
        cells: boxCells(a.type, a.rot).map(([r, c]) => [a.row + r, a.col + c]) } : null,
      hold: this.holdType, next: this.queue.slice(0, 3),
      score: this.score, lines: this.lines, level: this.level, over: this.over, paused: this.paused,
    };
  }
}

const COLORS = {I:'#00f0f0',O:'#f0f000',T:'#a000f0',S:'#00f000',Z:'#f00000',J:'#0000f0',L:'#f0a000'};
let game = new Game(Date.now() | 0), manual = false, last = performance.now();
const cv = document.getElementById('board'), ctx = cv.getContext('2d');
function cell(c, x, y, col, s, ghost) { c.strokeStyle = col; c.fillStyle = col; if (ghost) c.strokeRect(x*s+2, y*s+2, s-4, s-4); else c.fillRect(x*s+1, y*s+1, s-2, s-2); }
function mini(id, types) { const m = document.getElementById(id).getContext('2d'); m.clearRect(0, 0, 120, 270);
  types.forEach((t, i) => { if (t) for (const [r, c] of boxCells(t, 0)) cell(m, c + 0.5, r + i * 3 + 0.5, COLORS[t], 22); }); }
function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 300, 600); ctx.strokeStyle = '#222';
  for (let x = 0; x <= 10; x++) { ctx.beginPath(); ctx.moveTo(x*30, 0); ctx.lineTo(x*30, 600); ctx.stroke(); }
  for (let y = 0; y <= 20; y++) { ctx.beginPath(); ctx.moveTo(0, y*30); ctx.lineTo(300, y*30); ctx.stroke(); }
  const s = game.state();
  s.board.forEach((row, r) => row.forEach((t, c) => { if (t && r >= 2) cell(ctx, c, r - 2, COLORS[t], 30); }));
  if (s.active && !s.over) {
    const a = game.active; let row = a.row; while (game.fits(a.type, a.rot, row + 1, a.col)) row++;
    for (const [r, c] of boxCells(a.type, a.rot)) if (row + r >= 2) cell(ctx, a.col + c, row + r - 2, COLORS[a.type], 30, true);
    for (const [r, c] of s.active.cells) if (r >= 2) cell(ctx, c, r - 2, COLORS[a.type], 30);
  }
  if (s.over) { ctx.fillStyle = '#fff'; ctx.font = '32px monospace'; ctx.fillText('GAME OVER', 60, 300); }
  document.getElementById('score').textContent = s.score; document.getElementById('lines').textContent = s.lines;
  document.getElementById('level').textContent = s.level; mini('next', s.next); mini('hold', [s.hold]);
}
const KEYS = {ArrowLeft:'left',ArrowRight:'right',ArrowDown:'down',' ':'drop',ArrowUp:'cw',x:'cw',X:'cw',z:'ccw',Z:'ccw',c:'hold',C:'hold',Shift:'hold',p:'pause',P:'pause'};
addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); game = new Game(Date.now() | 0); draw(); return; }
  const a = KEYS[e.key]; if (!a) return; e.preventDefault(); game.input(a); draw();
});
function frame(now) { if (!manual) game.tick(Math.min(250, Math.round(now - last))); last = now; draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
window.tetris = { reset(seed) { manual = true; game = new Game(seed); draw(); }, input(a) { game.input(a); draw(); },
  tick(ms) { game.tick(ms); draw(); }, state() { return game.state(); } };
</script></body></html>
