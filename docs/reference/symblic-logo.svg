<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#121829" />
      <stop offset="100%" stop-color="#07090F" />
    </radialGradient>

    <!-- Glowing Core Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur1" />
      <feGaussianBlur stdDeviation="35" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00F2FE" flood-opacity="0.35" />
    </filter>

    <!-- Gradients for Facets & Neural Synapses -->
    <!-- Top Isometric Face: Cold Deterministic Logic (Cyan/Teal) -->
    <linearGradient id="topFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E65FF" />
      <stop offset="100%" stop-color="#92EFFD" />
    </linearGradient>

    <!-- Left Isometric Face: Pure Kernel Mathematical Invariants (Deep Electric Cyan) -->
    <linearGradient id="leftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C0FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>

    <!-- Right Isometric Face: Neural Synaptic Models (Vibrant Violet / Magenta) -->
    <linearGradient id="rightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF" />
      <stop offset="100%" stop-color="#E100FF" />
    </linearGradient>

    <!-- Neural Energy Ribbon (The S-Curve Bridge) -->
    <linearGradient id="neuralRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#9B51E0" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>

    <!-- Gold Accent for Pure Consensus & Proof -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE000" />
      <stop offset="100%" stop-color="#799F0C" />
    </linearGradient>
  </defs>

  <!-- Deep Canvas -->
  <rect width="800" height="800" rx="160" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Circuit Grid Lines -->
  <g opacity="0.12" stroke="#4FACFE" stroke-width="1.5">
    <circle cx="400" cy="400" r="280" fill="none" stroke-dasharray="8 12" />
    <circle cx="400" cy="400" r="340" fill="none" stroke-width="1" />
    <line x1="400" y1="60" x2="400" y2="740" stroke-dasharray="6 8" />
    <line x1="60" y1="400" x2="740" y2="400" stroke-dasharray="6 8" />
  </g>

  <!-- Central Emblem: The Neuro-Symbolic Crystalline Hexagon with "S" Flow -->
  <g filter="url(#neonGlow)">
    
    <!-- Outer Sacred Geometry Ring: Datalog & Logic Nodes -->
    <g stroke="url(#topFacet)" stroke-width="2.5" fill="none" opacity="0.6">
      <!-- 6 Orbital Vertices (60 deg increments) -->
      <line x1="400" y1="170" x2="599" y2="285" />
      <line x1="599" y1="285" x2="599" y2="515" />
      <line x1="599" y1="515" x2="400" y2="630" />
      <line x1="400" y1="630" x2="201" y2="515" />
      <line x1="201" y1="515" x2="201" y2="285" />
      <line x1="201" y1="285" x2="400" y2="170" />
    </g>

    <!-- Node Constellations at Vertices -->
    <circle cx="400" cy="170" r="6" fill="#00F2FE" />
    <circle cx="599" cy="285" r="6" fill="#E100FF" />
    <circle cx="599" cy="515" r="6" fill="#00F2FE" />
    <circle cx="400" cy="630" r="6" fill="#E100FF" />
    <circle cx="201" cy="515" r="6" fill="#00F2FE" />
    <circle cx="201" cy="285" r="6" fill="#E100FF" />

    <!-- Isometric Crystal Cube (The Deterministic Kernel) -->
    <!-- Top Face -->
    <polygon points="400,220 556,310 400,400 244,310" 
             fill="url(#topFacet)" opacity="0.88" />
    
    <!-- Left Face -->
    <polygon points="244,310 400,400 400,580 244,490" 
             fill="url(#leftFacet)" opacity="0.92" />
    
    <!-- Right Face -->
    <polygon points="400,400 556,310 556,490 400,580" 
             fill="url(#rightFacet)" opacity="0.95" />

    <!-- The Crystalline Inset Lines (Exact Dimensions) -->
    <path d="M400,220 L400,400 M400,400 L244,310 M400,400 L556,310 M400,400 L400,580" 
          stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.75" />

    <!-- The Stylized "S" Ribbon: The Neuro-Symbolic Bridge Intertwining the Cube -->
    <path d="M 480,240 
             C 320,200 210,320 280,420 
             C 340,500 480,450 510,530 
             C 540,610 390,660 310,600" 
          fill="none" 
          stroke="url(#neuralRibbon)" 
          stroke-width="26" 
          stroke-linecap="round" 
          filter="url(#softShadow)" />

    <!-- Glowing Core Pulse at the exact Intersection (The Contract Node) -->
    <circle cx="400" cy="400" r="16" fill="#FFFFFF" opacity="0.95" />
    <circle cx="400" cy="400" r="28" fill="none" stroke="#00F2FE" stroke-width="4" opacity="0.8" />
  </g>

  <!-- Typography: SYMBLIC -->
  <text x="400" y="715" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', sans-serif" 
        font-size="44" 
        font-weight="800" 
        letter-spacing="14" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        opacity="0.95">
    SYMBLIC
  </text>
  
  <text x="400" y="750" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Text', sans-serif" 
        font-size="14" 
        font-weight="600" 
        letter-spacing="6" 
        fill="#00F2FE" 
        text-anchor="middle" 
        opacity="0.8">
    NEURO-SYMBOLIC RUNTIME
  </text>
</svg>
